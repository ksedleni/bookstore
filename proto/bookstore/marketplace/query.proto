syntax = "proto3";

package bookstore.marketplace;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "bookstore/marketplace/params.proto";
import "bookstore/marketplace/listing.proto";
import "bookstore/marketplace/pause_state.proto";

option go_package = "github.com/ksedleni/bookstore/x/marketplace/types";

// Query defines the gRPC querier service.
service Query {
  
  // Parameters queries the parameters of the module.
  rpc Params (QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/ksedleni/bookstore/marketplace/params";
  
  }
  
  // Queries a list of Listing items.
  rpc Listing    (QueryGetListingRequest) returns (QueryGetListingResponse) {
    option (google.api.http).get = "/ksedleni/bookstore/marketplace/listing/{id}";
  
  }
  rpc ListingAll (QueryAllListingRequest) returns (QueryAllListingResponse) {
    option (google.api.http).get = "/ksedleni/bookstore/marketplace/listing";
  
  }
  
  // Queries a PauseState by index.
  rpc PauseState (QueryGetPauseStateRequest) returns (QueryGetPauseStateResponse) {
    option (google.api.http).get = "/ksedleni/bookstore/marketplace/pause_state";
  
  }
}
// QueryParamsRequest is request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is response type for the Query/Params RPC method.
message QueryParamsResponse {
  
  // params holds all the parameters of this module.
  Params params = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

message QueryGetListingRequest {
  uint64 id = 1;
}

message QueryGetListingResponse {
  Listing Listing = 1 [(gogoproto.nullable) = false];
}

message QueryAllListingRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

message QueryAllListingResponse {
  repeated Listing                                Listing    = 1 [(gogoproto.nullable) = false];
           cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryGetPauseStateRequest {}

message QueryGetPauseStateResponse {
  PauseState PauseState = 1 [(gogoproto.nullable) = false];
}

